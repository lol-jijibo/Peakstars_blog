# 开发环境配置
spring:
  mail:
    # QQ 邮箱 SMTP 服务配置，开发环境请通过环境变量注入账号与授权码
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: ${MAIL_PROTOCOL:smtps}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  storage:
    oss:
      # 阿里云 OSS 开发配置默认关闭，确需启用时再通过环境变量显式打开
      enabled: ${OSS_ENABLED:false}
      endpoint: ${OSS_ENDPOINT:oss-cn-chengdu.aliyuncs.com}
      access-key-id: ${OSS_ACCESS_KEY_ID:}
      access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
      bucket: ${OSS_BUCKET:stars-book}
      public-base-url: ${OSS_PUBLIC_BASE_URL:https://stars-book.oss-cn-chengdu.aliyuncs.com}
    minio:
      # 启用前需先启动本地 MinIO 服务：
      # docker run -d --name minio -p 9000:9000 -p 9001:9001 ^
      #   -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin ^
      #   minio/minio server /data --console-address ":9001"
      enabled: ${MINIO_ENABLED:true}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
  auth:
    token-secret: ${AUTH_TOKEN_SECRET:dev-secret-key-for-local-development-only}
    verification:
      # 发件人邮箱必须非空，开发环境默认跟随 MAIL_USERNAME，也可通过 MAIL_FROM 单独覆盖
      mail-from: ${MAIL_FROM:${MAIL_USERNAME:}}
