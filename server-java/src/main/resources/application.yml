server:
  port: ${SERVER_PORT:0}

spring:
  application:
    name: interview-auth-service
  profiles:
    active: dev
  datasource:
    # 兼容本地 MySQL 8 默认认证握手
    # 在开发环境关闭 SSL 时显式允许拉取公钥，避免接口查询阶段拿不到 JDBC 连接
    url: jdbc:mysql://localhost:3306/interview_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: lixuF123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 5s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: ${MAIL_PROTOCOL:smtps}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.interview.auth.domain.entity
  configuration:
    map-underscore-to-camel-case: true

app:
  content-import:
  # 总开关：是否开启内容导入功能
    enabled: ${CONTENT_IMPORT_ENABLED:true}
    # 是否迁移图片/文件等资源
    migrate-assets: ${CONTENT_IMPORT_MIGRATE_ASSETS:true}
    # 是否严格校验资源迁移（失败就报错）
    strict-asset-migration: ${CONTENT_IMPORT_STRICT_ASSET_MIGRATION:false}
    # 连接超时 5 秒
    connect-timeout-millis: ${CONTENT_IMPORT_CONNECT_TIMEOUT_MILLIS:5000}
    # 读取超时 15 秒
    read-timeout-millis: ${CONTENT_IMPORT_READ_TIMEOUT_MILLIS:15000}
    # 最大资源大小 10MB
    max-asset-size-bytes: ${CONTENT_IMPORT_MAX_ASSET_SIZE_BYTES:10485760}
    # 上传文件前缀目录
    upload-prefix: ${CONTENT_IMPORT_UPLOAD_PREFIX:content-import}
    # 本地静态资源目录（用于将 /xxx.jpg 等相对路径图片上传到对象存储）
    local-static-dir: ${CONTENT_IMPORT_LOCAL_STATIC_DIR:public}
    # 是否迁移本地相对路径资源到对象存储
    migrate-local-assets: ${CONTENT_IMPORT_MIGRATE_LOCAL_ASSETS:true}

   # 文件存储配置
  storage:
    oss:
      enabled: ${OSS_ENABLED:false}
      endpoint: ${OSS_ENDPOINT:}
      access-key-id: ${OSS_ACCESS_KEY_ID:}
      access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
      bucket: ${OSS_BUCKET:}
      public-base-url: ${OSS_PUBLIC_BASE_URL:}
    minio:
      enabled: ${MINIO_ENABLED:false}
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: ${MINIO_BUCKET:peakstars-content}
      public-base-url: ${MINIO_PUBLIC_BASE_URL:http://localhost:9000}
  auth:
    token-secret: interview-demo-auth-secret
    token-expire-hours: 168
    verification:
      register-code-expire-seconds: ${REGISTER_CODE_EXPIRE_SECONDS:300}
      register-send-cooldown-seconds: ${REGISTER_SEND_COOLDOWN_SECONDS:60}
      register-max-verify-attempts: ${REGISTER_MAX_VERIFY_ATTEMPTS:5}
      register-max-send-per-email-per-day: ${REGISTER_MAX_SEND_PER_EMAIL_PER_DAY:10}
      register-max-send-per-ip-per-day: ${REGISTER_MAX_SEND_PER_IP_PER_DAY:30}
      register-code-length: ${REGISTER_CODE_LENGTH:6}
      mail-from: ${MAIL_FROM:${MAIL_USERNAME:}}
      register-mail-subject: ${REGISTER_MAIL_SUBJECT:PeakStars_blog Register Code}
